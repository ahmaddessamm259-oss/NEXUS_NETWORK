<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>NEXUS NETWORK | Maps & Scripts</title>
  <style>
    :root {
      --bg: #07090f;
      --panel: #101522;
      --item: #171e30;
      --line: rgba(255, 255, 255, 0.1);
      --text: #f4f7fc;
      --muted: #9aa6bd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .random-colors {
      font-weight: 900;
      letter-spacing: 0.05em;
      background: linear-gradient(
        90deg,
        hsl(var(--c1, 180), 95%, 60%),
        hsl(var(--c2, 270), 95%, 65%),
        hsl(var(--c3, 330), 95%, 62%),
        hsl(var(--c4, 45), 95%, 58%)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(7, 9, 15, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
    }

    .header-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-top {
      font-size: 1.25rem;
    }

    .container {
      max-width: 820px;
      margin: 18px auto 0;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Map List Accordion */
    .map-menu {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
    }

    .map-trigger {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
    }

    .map-trigger:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .map-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    .arrow {
      font-size: 0.9rem;
      transition: transform 0.2s ease;
    }

    .map-menu.open .arrow {
      transform: rotate(90deg);
    }

    .map-scripts {
      display: none;
      padding: 0 14px 14px;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid var(--line);
    }

    .map-menu.open .map-scripts {
      display: flex;
      padding-top: 12px;
    }

    .script-row {
      background: var(--item);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .script-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .script-title {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .badge.key {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .badge.keyless {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    code {
      display: block;
      background: rgba(0, 0, 0, 0.38);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.75rem;
      color: #dbeafe;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .btn-copy {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Popup Ad: every 30s for 10s, closable anytime */
    .ad-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .ad-overlay.active {
      display: flex;
    }

    .ad-box {
      width: 100%;
      max-width: 420px;
      background: #121726;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .ad-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ad-count {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .ad-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(239, 68, 68, 0.22);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
    }

    .ad-offer {
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .ad-offer h3 {
      color: #34d399;
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .ad-mc {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.88rem;
      text-align: center;
    }

    .ad-owner {
      text-align: center;
      font-size: 0.95rem;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #10b981;
      color: #04120c;
      font-weight: 800;
      padding: 9px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

    const mapsContainer = document.getElementById("mapsContainer");
    const toast = document.getElementById("toast");

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1500);
    }

    async function copyCode(text, label) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(label);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(label);
      }
    }

    function esc(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
