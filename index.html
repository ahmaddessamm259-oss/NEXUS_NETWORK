<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS NETWORK</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f1218;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 520px;
      margin: 25px auto;
      background: #181d27;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
    a.discord-btn {
      display: inline-block;
      background: #5865F2;
      color: #ffffff;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: 9px;
      font-weight: bold;
      margin: 8px 0;
    }
    input, button {
      width: 90%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 9px;
      border: none;
      font-size: 15px;
      box-sizing: border-box;
    }
    input {
      background: #232a38;
      color: #ffffff;
    }
    button {
      background: #00b894;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #b2bec3;
    }
  </style>
</head>
<body>

  <!-- رابط الديسكورد فوق -->
  <div>
    <a class="discord-btn" href="https://discord.gg/TNAjadyGt" target="_blank">
      انضم لسيرفر NEXUS NETWORK على ديسكورد
    </a>
  </div>

  <!-- مكان التخطي في منتصف الموقع -->
  <div class="box">
    <h2>NEXUS NETWORK</h2>
    <p>حط الرابط هنا عشان يتخطاه</p>
    <input type="text" id="targetUrl" placeholder="الصق الرابط هنا..." />
    <button onclick="handleBypass()">تخطي الآن</button>
    <p id="result"></p>
  </div>

  <!-- رابط الديسكورد تحت + الحقوق -->
  <div class="footer">
    <div>
      <a class="discord-btn" href="https://discord.gg/TNAjadyGt" target="_blank">
        سيرفر الديسكورد الرسمي
      </a>
    </div>
    <p>جميع الحقوق محفوظة © NEXUS NETWORK - أحمد</p>
  </div>

  <script>
    function handleBypass() {
      const val = document.getElementById("targetUrl").value.trim();
      const res = document.getElementById("result");
      if (!val) {
        res.textContent = "من فضلك ضع رابطاً أولاً.";
        return;
      }
      // هنا يتم ربط أداة أو خدمة التخطي الفعلي لاحقاً
      res.textContent = "تم استلام الرابط: " + val;
    }
  </script>

</body>
</html>
