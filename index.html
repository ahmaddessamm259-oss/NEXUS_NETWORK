<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>NEXUS NETWORK</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090c14;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 16px;
      padding-bottom: 60px;
    }

    .random-name {
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1px;
      transition: color 0.4s ease;
    }

    .header-box {
      max-width: 700px;
      margin: 0 auto 18px auto;
      padding: 14px 16px;
      background: #121826;
      border: 1px solid #26324d;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lists-stack {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-item {
      background: #131a2a;
      border: 1px solid #283552;
      border-radius: 10px;
      overflow: hidden;
    }

    .menu-btn {
      width: 100%;
      background: #182238;
      color: #ffffff;
      border: none;
      padding: 15px 16px;
      font-size: 17px;
      font-weight: bold;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .menu-btn:hover {
      background: #1f2c47;
    }

    .scripts-box {
      display: none;
      padding: 12px;
      background: #0e1320;
      border-top: 1px solid #283552;
    }

    .scripts-box.open {
      display: block;
    }

    .script-card {
      background: #161f33;
      border: 1px solid #293859;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .script-card:last-child {
      margin-bottom: 0;
    }

    .script-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 8px;
    }

    .script-title {
      font-weight: bold;
      font-size: 14px;
    }

    .badge-key {
      background: #78350f;
      color: #fde68a;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-keyless {
      background: #064e3b;
      color: #a7f3d0;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }

    .script-code {
      background: #090d16;
      color: #93c5fd;
      padding: 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 8px;
    }

    .copy-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Popup Ad: every 30s for 10s, closable anytime */
    .ad-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .ad-backdrop.show {
      display: flex;
    }

    .ad-card {
      width: 100%;
      max-width: 400px;
      background: #131a2a;
      border: 1px solid #3b4f7a;
      border-radius: 14px;
      padding: 16px;
    }

    .ad-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .ad-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #dc2626;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .ad-robux {
      background: #064e3b;
      border: 1px solid #10b981;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      margin-bottom: 10px;
    }

    .ad-robux h3 {
      color: #34d399;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .ad-mc {
      background: #0c1220;
      border: 1px dashed #475569;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .ad-foot {
      text-align: center;
      font-size: 15px;
    }

    .copied-toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: #04130c;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 999px;
      display: none;
      z-index: 1000;
    }

    .copied-toast.show {
      display: block;
    }
  </style>
</head>
<body>

  <div class="header-box">
    <!-- غير اسم القناة هنا لو حبيت -->
    <span class="random-name brand-target">NEXUS NETWORK</span>
    <span style="font-size: 12px; color: #94a3b8;">6 Lists</span>
  </div>

  <!-- القوائم كلها تحت بعضها -->
  <div class="lists-stack" id="listsStack"></div>

  <!-- الإعلان: يظهر كل 30 ثانية لمدة 10 ثواني ويمكن إغلاقه في أي وقت -->
  <div class="ad-backdrop" id="adBackdrop">
    <div class="ad-card">
      <div class="ad-head">
        <span id="adTimerText" style="font-size: 13px; color: #cbd5e1;">10s</span>
        <button class="ad-close" id="adCloseBtn" type="button">×</button>
      </div>

      <div class="ad-robux">
        <h3>100 ROBUX</h3>
        <p>100 Robux اول ما تخش القناة</p>
      </div>

      <div class="ad-mc">
        <strong>سيرفر ماين كرافت للبدروك (Bedrock)</strong><br />
        <span>IP: play.nexusnetwork.mc | Port: 19132</span>
      </div>

      <div class="ad-foot">
        الحقوق: <span class="random-name brand-target">NEXUS NETWORK</span>
      </div>
    </div>
  </div>

  <div class="copied-toast" id="copiedToast">Copied!</div>

  <script>
    // ألوان عشوائية مستمرة لاسم القناة في الهيدر وفي الإعلان
    const RANDOM_COLORS = [
      "#ff4d6d", "#00f5d4", "#ffd166", "#4cc9f0",
      "#c77dff", "#80ed99", "#ff9f1c", "#f72585"
    ];

    function updateRandomColors() {
      const c1 = RANDOM_COLORS[Math.floor(Math.random() * RANDOM_COLORS.length)];
      let c2 = RANDOM_COLORS[Math.floor(Math.random() * RANDOM_COLORS.length)];
      if (c2 === c1) c2 = "#00f5d4";

      document.querySelectorAll(".brand-target").forEach((el) => {
        el.style.color = c1;
        el.style.textShadow = `0 0 12px ${c2}`;
      });
    }

    updateRandomColors();
    setInterval(updateRandomColors, 900);

    // 6 قوائم تحت بعض، كل قائمة فيها 8 سكربتات (4 بكود Key و 4 بدون كود Keyless)
    const LISTS = [
      {
        id: "mm2",
        title: "MM2",
        scripts: [
          { name: "Xhub MM2", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/Au0yX/Community/main/XhubMM2"))()' },
          { name: "Vertex MM2", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/vertex-peak/vertex/refs/heads/main/loadstring"))()' },
          { name: "Symphony MM2", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/ThatSick/ArrayField/main/SymphonyHub.lua"))()' },
          { name: "R3THPRIV MM2", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/R3TH-PRIV/R3THPRIV/main/Loader.lua"))()' },
          { name: "YARHM MM2 Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://yarhm.goteamup.com/yarhm/rm/mm2.lua"))()' },
          { name: "Solara MM2 Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/solara-hub/mm2/main/keyless.lua"))()' },
          { name: "Mars MM2 Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/MarsHub/MM2/main/Keyless.lua"))()' },
          { name: "Byte MM2 Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/ByteHub/MM2/main/KeylessLoader.lua"))()' }
        ]
      },
      {
        id: "blox-fruits",
        title: "Blox Fruits",
        scripts: [
          { name: "Redz Hub", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/realredz/BloxFruits/refs/heads/main/Source.lua"))()' },
          { name: "Hoho Hub", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/acsu123/HOHO_H/main/Loading_UI"))()' },
          { name: "W-Azure Hub", hasKey: true, code: 'loadstring(game:HttpGet("https://api.luarmor.net/files/v3/loaders/3b2169cf53bc6104dabe8e19562e5cc2.lua"))()' },
          { name: "Thunder Z Hub", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/ThunderZ-05/HUB/main/Script"))()' },
          { name: "Speed Hub X Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/AhmadV99/Speed-Hub-X/main/Speed%20Hub%20X.lua"))()' },
          { name: "Xero Hub Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://xero-hub.com/v2/loaders/bloxfruits.lua"))()' },
          { name: "Neva Hub Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/NevaHub/Keyless/main/BloxFruits.lua"))()' },
          { name: "Min Gaming Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/LuaCrack/Min/refs/heads/main/MinGamingVn"))()' }
        ]
      },
      {
        id: "timebomb",
        title: "Timebomb",
        scripts: [
          { name: "Timebomb Pro Hub", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/timebomb/main/pro.lua"))()' },
          { name: "Bomb Timer & ESP", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/timebomb/main/esp.lua"))()' },
          { name: "Auto Pass Bomb", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/timebomb/main/autopass.lua"))()' },
          { name: "Timebomb V2 Hub", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/timebomb/main/v2.lua"))()' },
          { name: "Timebomb Keyless Hub", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/timebomb/main/keyless-hub.lua"))()' },
          { name: "Speed & Jump Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/timebomb/main/keyless-move.lua"))()' },
          { name: "Radar Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/timebomb/main/keyless-radar.lua"))()' },
          { name: "Lite Survival Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/timebomb/main/keyless-lite.lua"))()' }
        ]
      },
      {
        id: "brookhaven",
        title: "Brookhaven",
        scripts: [
          { name: "R4D Brookhaven", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/M1dem1/Brookhaven/main/R4D.lua"))()' },
          { name: "IceHub Brookhaven", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/IceMael7/NewIceHub/main/Brookhaven"))()' },
          { name: "JulHub Brookhaven", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/JulHub/Brookhaven/main/Loader.lua"))()' },
          { name: "SanderX Brookhaven", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/sXPiter666/SanderXV4.0/main/SanderX.lua"))()' },
          { name: "Redz Brookhaven Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/realredz/Brookhaven/main/Keyless.lua"))()' },
          { name: "Chaos RP Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/ChaosHub/Brookhaven/main/Keyless.lua"))()' },
          { name: "Vortex RP Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/VortexHub/Brookhaven/main/Keyless.lua"))()' },
          { name: "Simple RP Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/SimpleHub/Brookhaven/main/Keyless.lua"))()' }
        ]
      },
      {
        id: "plants-defense",
        title: "Plants Defense (ماب النباتات)",
        scripts: [
          { name: "Plants Defense Auto Hub", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/plants-defense/main/auto-hub.lua"))()' },
          { name: "Smart Plant Placer", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/plants-defense/main/placer.lua"))()' },
          { name: "Wave Skip & Upgrade", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/plants-defense/main/waves.lua"))()' },
          { name: "Sun Farm Pro", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/plants-defense/main/sunfarm.lua"))()' },
          { name: "Plants Keyless Hub", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/plants-defense/main/keyless-hub.lua"))()' },
          { name: "Auto Collect Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/plants-defense/main/keyless-collect.lua"))()' },
          { name: "Fast Upgrade Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/plants-defense/main/keyless-upgrade.lua"))()' },
          { name: "Lite Defense Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/plants-defense/main/keyless-lite.lua"))()' }
        ]
      },
      {
        id: "steal-an-egg",
        title: "Steal an Egg (ماب سرقة البيض)",
        scripts: [
          { name: "Egg Stealer Pro Hub", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/steal-an-egg/main/pro.lua"))()' },
          { name: "Rare Egg ESP", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/steal-an-egg/main/esp.lua"))()' },
          { name: "Auto Return Base", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/steal-an-egg/main/return.lua"))()' },
          { name: "Speed & Steal V2", hasKey: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/steal-an-egg/main/v2.lua"))()' },
          { name: "Steal Egg Keyless Hub", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/steal-an-egg/main/keyless-hub.lua"))()' },
          { name: "Egg Finder Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/steal-an-egg/main/keyless-esp.lua"))()' },
          { name: "Boost Speed Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/steal-an-egg/main/keyless-speed.lua"))()' },
          { name: "Instant Grab Keyless", hasKey: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/nexus-scripts/steal-an-egg/main/keyless-grab.lua"))()' }
        ]
      }
    ];

    const listsStack = document.getElementById("listsStack");
    const copiedToast = document.getElementById("copiedToast");

    function escapeText(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function showCopied(msg = "Copied!") {
      copiedToast.textContent = msg;
      copiedToast.classList.add("show");
      setTimeout(() => copiedToast.classList.remove("show"), 1500);
    }

    function copyScriptText(code, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(() => showCopied(label)).catch(() => fallbackCopy(code, label));
      } else {
        fallbackCopy(code, label);
      }
    }

    function fallbackCopy(code, label) {
      const box = document.createElement("textarea");
      box.value = code;
      document.body.appendChild(box);
      box.select();
      document.execCommand("copy");
      document.body.removeChild(box);
      showCopied(label);
    }

    listsStack.innerHTML = LISTS.map(
      (list) => `
      <div class="menu-item">
        <button class="menu-btn" type="button" data-target="box-${list.id}">
          <span>${escapeText(list.title)}</span>
          <span>▼</span>
        </button>
        <div class="scripts-box" id="box-${list.id}">
          ${list.scripts
            .map(
              (sc, i) => `
              <div class="script-card">
                <div class="script-top">
                  <span class="script-title">${escapeText(sc.name)}</span>
                  <span class="${sc.hasKey ? "badge-key" : "badge-keyless"}">${sc.hasKey ? "Key (بكود)" : "Keyless (بدون كود)"}</span>
                </div>
                <div class="script-code">${escapeText(sc.code)}</div>
                <button class="copy-btn" type="button" data-list="${list.id}" data-idx="${i}">نسخ السكريبت</button>
              </div>
            `
            )
            .join("")}
        </div>
      </div>
    `
    ).join("");

    document.querySelectorAll(".menu-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const box = document.getElementById(btn.dataset.target);
        box.classList.toggle("open");
      });
    });

    document.querySelectorAll(".copy-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const listObj = LISTS.find((item) => item.id === btn.dataset.list);
        const scriptObj = listObj && listObj.scripts[Number(btn.dataset.idx)];
        if (scriptObj) {
          copyScriptText(scriptObj.code, `${scriptObj.name} copied!`);
        }
      });
    });

    // إعلان يظهر كل 30 ثانية لمدة 10 ثواني ويمكن إغلاقه في أي وقت
    const adBackdrop = document.getElementById("adBackdrop");
    const adCloseBtn = document.getElementById("adCloseBtn");
    const adTimerText = document.getElementById("adTimerText");
    let adCountdown = null;

    function closeAdNow() {
      adBackdrop.classList.remove("show");
      if (adCountdown) {
        clearInterval(adCountdown);
        adCountdown = null;
      }
    }

    function openAd10Sec() {
      let sec = 10;
      adTimerText.textContent = `${sec}s`;
      adBackdrop.classList.add("show");

      if (adCountdown) clearInterval(adCountdown);

      adCountdown = setInterval(() => {
        sec -= 1;
        if (sec > 0) {
          adTimerText.textContent = `${sec}s`;
        } else {
          closeAdNow();
        }
      }, 1000);
    }

    adCloseBtn.addEventListener("click", closeAdNow);
    setInterval(openAd10Sec, 30000);
  </script>
</body>
  </html>
